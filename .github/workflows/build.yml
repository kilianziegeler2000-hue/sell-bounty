name: Build SellSystem

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build SellSystem
        run: mvn -B clean package -f SellSystem-2.1-Source/pom.xml

      - name: Upload SellSystem JAR
        uses: actions/upload-artifact@v4
        with:
          name: SellSystem-2.1
          path: SellSystem-2.1-Source/target/SellSystem-2.1.0.jar
