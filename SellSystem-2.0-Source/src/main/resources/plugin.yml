name: SellSystem
version: 2.0.0
main: de.openai.sellsystem.SellSystemPlugin
api-version: '1.21'
author: OpenAI
depend: [Vault]

commands:
  sell:
    description: Öffnet das normale Sell-Menü.
    usage: /sell
    permission: sellsystem.sell
  sellmulti:
    description: Öffnet das Kategorie-Sell-Menü.
    usage: /sellmulti
    permission: sellsystem.sellmulti

permissions:
  sellsystem.sell:
    default: true
  sellsystem.sellmulti:
    default: true
