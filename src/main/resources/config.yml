settings:
  prefix: "&8[&aSell&8] "
  sell-title: "&8Sell"
  sellmulti-title: "&8Sell Multi"
  progress-title: "&8%category% Progress"
  default-price: 1.0
  sold: "&aVerkauft für &e%money%$ &7(Multiplikator: &a%multiplier%x&7)"
  nothing-sold: "&cDu hast keine Items eingelegt."
  cancelled: "&7Verkauf abgebrochen."

# ALLE Items sind verkaufbar.
# Items, die hier nicht eingetragen sind, benutzen settings.default-price.
# Hier kannst du spezielle Preise überschreiben.
prices:
  DIRT: 0.10
  COBBLESTONE: 0.15
  STONE: 0.20
  OAK_LOG: 1.50
  WHEAT: 0.75
  ROTTEN_FLESH: 0.50
  FEATHER: 0.60
  IRON_INGOT: 3.0
