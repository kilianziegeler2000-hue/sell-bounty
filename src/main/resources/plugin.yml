name: SellSystem
version: 2.1.0
main: de.openai.sellsystem.SellSystemPlugin
api-version: '1.21'
author: OpenAI
depend: [Vault]

commands:
  sell:
    description: Öffnet das Sell-Menü.
    usage: /sell
    permission: sellsystem.sell
  sellmulti:
    description: Öffnet das Sell-Multiplier-Menü.
    usage: /sellmulti
    permission: sellsystem.sellmulti

permissions:
  sellsystem.sell:
    default: true
  sellsystem.sellmulti:
    default: true
